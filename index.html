<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multilingual Help Desk</title>
  <style>
    body   { font-family: system-ui, sans-serif; max-width: 820px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1     { font-size: 24px; margin-bottom: 4px; }
    .note  { color: #666; font-size: 14px; margin-top: 0; }
    .box   { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 16px 0; }
    label  { display: inline-block; min-width: 90px; font-weight: 600; }
    select, button, input { font-size: 15px; margin: 6px 4px 6px 0; }
    button { padding: 6px 14px; cursor: pointer; }
    #submitBtn { background: #0b6; color: white; border: none; border-radius: 6px; }
    .tag   { display: inline-block; background: #e8f0fe; border-radius: 12px; padding: 3px 10px; margin: 3px; }
    table  { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
    th     { background: #f5f5f5; }
    #status { font-weight: 600; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Multilingual Help Desk</h1>
  <p class="note">Hospital test scenario. Not a replacement for a certified medical interpreter.</p>

  <!-- 1. Input: language, voice, record or upload, submit -->
  <div class="box">
    <div>
      <label for="language">Language</label>
      <select id="language">
        <option value="zh-CN">Chinese (zh-CN)</option>
        <option value="en-US">English (en-US)</option>
        <option value="es-ES">Spanish (es-ES)</option>
        <option value="ko-KR">Korean (ko-KR)</option>
        <option value="ja-JP">Japanese (ja-JP)</option>
      </select>
    </div>
    <div>
      <label for="voice">Voice</label>
      <select id="voice"></select>
    </div>
    <div>
      <label>Record</label>
      <button id="recordBtn">Start recording</button>
      <span id="recordInfo"></span>
    </div>
    <div>
      <label for="fileInput">Or upload</label>
      <input type="file" id="fileInput" accept=".wav,.mp3,.m4a,.webm,.ogg,.aac">
    </div>
    <button id="submitBtn">Submit</button>
    <span id="status"></span>
  </div>

  <!-- 2. Results panel (hidden until a result arrives) -->
  <div id="results" class="box hidden">
    <h3>Transcript</h3>
    <p id="transcript"></p>
    <p class="note" id="confidence"></p>

    <h3>English translation (for staff)</h3>
    <p id="translation"></p>

    <h3>Key phrases</h3>
    <div id="keyPhrases"></div>

    <h3>Named entities</h3>
    <table>
      <thead><tr><th>Text</th><th>Category</th><th>Confidence</th></tr></thead>
      <tbody id="entities"></tbody>
    </table>

    <h3>Sentiment</h3>
    <p id="sentiment"></p>

    <h3>Summary (for staff)</h3>
    <p id="summary"></p>

    <h3>Reply to the patient</h3>
    <p id="replyText"></p>
    <div id="playerSlot"></div>

    <p class="note" id="timings"></p>
  </div>

  <script>
    // ---------- E-JS 1: find the page elements ----------
    const languageSel = document.getElementById("language");
    const voiceSel    = document.getElementById("voice");
    const recordBtn   = document.getElementById("recordBtn");
    const recordInfo  = document.getElementById("recordInfo");
    const fileInput   = document.getElementById("fileInput");
    const submitBtn   = document.getElementById("submitBtn");
    const statusEl    = document.getElementById("status");

    // The audio player for the TTS reply (D2: plays in the browser, no plugins).
    const player = new Audio();
    player.controls = true;
    document.getElementById("playerSlot").appendChild(player);

    // ---------- E-JS 2: voice dropdown from GET /voices (D3) ----------
    async function loadVoices() {
      const res = await fetch("/voices?language=" + languageSel.value);
      const data = await res.json();
      voiceSel.innerHTML = "";
      for (const v of data.voices) {
        const opt = document.createElement("option");
        opt.value = v.name;
        opt.textContent = v.name + " (" + v.persona + ")";
        voiceSel.appendChild(opt);
      }
    }
    languageSel.addEventListener("change", loadVoices);
    loadVoices();

    // ---------- E-JS 3: record in the browser (MediaRecorder) ----------
    let recorder = null;
    let chunks = [];
    let recordedBlob = null;

    recordBtn.addEventListener("click", async () => {
      if (recorder && recorder.state === "recording") {
        recorder.stop();                      // second click: stop
        return;
      }
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recorder = new MediaRecorder(stream);
      chunks = [];
      recorder.ondataavailable = (e) => chunks.push(e.data);
      recorder.onstop = () => {
        recordedBlob = new Blob(chunks, { type: recorder.mimeType });
        stream.getTracks().forEach((t) => t.stop());   // turn the mic off
        recordBtn.textContent = "Start recording";
        recordInfo.textContent = "Recorded " + Math.round(recordedBlob.size / 1024) + " KB";
        fileInput.value = "";                 // use the recording, not a file
      };
      recorder.start();
      recordBtn.textContent = "Stop recording";
      recordInfo.textContent = "Recording...";
    });

    // ---------- E-JS 4: Submit -> POST /process ----------
    submitBtn.addEventListener("click", async () => {
      const form = new FormData();
      if (fileInput.files.length > 0) {
        form.append("audio", fileInput.files[0]);
      } else if (recordedBlob) {
        // Chrome records WebM; Safari records MP4 audio. The server converts both with ffmpeg.
        const ext = recordedBlob.type.includes("mp4") ? ".m4a" : ".webm";
        form.append("audio", recordedBlob, "recording" + ext);
      } else {
        statusEl.textContent = "Please record or choose a file first.";
        return;
      }
      form.append("language", languageSel.value);
      form.append("voice", voiceSel.value);

      statusEl.textContent = "Processing...";
      submitBtn.disabled = true;
      try {
        const res = await fetch("/process", { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok) {
          statusEl.textContent = "Error " + res.status + ": " + data.error;
          return;
        }
        showResults(data);
        statusEl.textContent = "Done.";
      } catch (err) {
        statusEl.textContent = "Network error: " + err;
      } finally {
        submitBtn.disabled = false;
      }
    });

    // ---------- E-JS 5: fill the results panel ----------
    function showResults(data) {
      document.getElementById("transcript").textContent = data.transcription.text;
      document.getElementById("confidence").textContent =
        "Speech confidence: " + data.transcription.confidence +
        " | Duration: " + data.transcription.duration_seconds + " s";
      document.getElementById("translation").textContent = data.translation_en;

      // key phrases as tags
      const kp = document.getElementById("keyPhrases");
      kp.innerHTML = "";
      for (const phrase of data.analysis.key_phrases) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = phrase;
        kp.appendChild(span);
      }

      // named entities in a table
      const tbody = document.getElementById("entities");
      tbody.innerHTML = "";
      for (const e of data.analysis.entities) {
        const row = document.createElement("tr");
        for (const value of [e.text, e.category, e.confidence]) {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        }
        tbody.appendChild(row);
      }

      // sentiment score
      const s = data.analysis.sentiment;
      document.getElementById("sentiment").textContent =
        s.label + " (positive " + s.scores.positive + ", neutral " + s.scores.neutral +
        ", negative " + s.scores.negative + ")";

      document.getElementById("summary").textContent = data.summary_en;
      document.getElementById("replyText").textContent =
        data.reply.text + "  [voice: " + data.reply.voice + "]";

      // TTS audio: base64 MP3 -> player (Pitfall 4: the data:audio/mp3;base64, prefix is required)
      player.src = "data:audio/mp3;base64," + data.reply.audio_base64;

      document.getElementById("timings").textContent =
        "Timings (ms): " + JSON.stringify(data.timings_ms);
      document.getElementById("results").classList.remove("hidden");
    }
  </script>
</body>
</html>
